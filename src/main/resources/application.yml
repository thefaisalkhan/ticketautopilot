spring:
  application:
    name: ticket-triage-copilot

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketautopilot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

# Vercel AI Gateway config for the Jev decision engine (wired in a later step).
ticketautopilot:
  jev:
    api-key: ${VERCEL_AI_GATEWAY_API_KEY:}
    base-url: ${VERCEL_AI_GATEWAY_BASE_URL:}
    model-id: typesafe-ai/jev
