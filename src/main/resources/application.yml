spring:
  application:
    name: ticket-triage-copilot

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketautopilot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

# OpenRouter config for the Jev decision engine.
# Jev is a "decisions" model, not a chat model — it's called via OpenRouter's
# alpha decisions endpoint (confirmed with a manual test call), not
# /chat/completions. The model id needs the leading "~".
ticketautopilot:
  jev:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/alpha/decisions}
    model-id: ~typesafe/jev-latest
