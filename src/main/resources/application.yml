spring:
  application:
    name: ticket-triage-copilot

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketautopilot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

# OpenRouter config for the Jev decision engine (wired in a later step).
# Jev is accessed as a chat-completions model on OpenRouter; the exact
# request/response field names Jev itself expects still need a manual
# test call to confirm (see README).
ticketautopilot:
  jev:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1/chat/completions}
    model-id: typesafe/jev-latest
